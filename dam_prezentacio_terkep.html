<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAM 2050 · Prezentációs térkép</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Courier New', monospace; background:#03060d; color:#cce; }
#map { position:fixed; inset:0; width:100vw; height:100vh; background:#03060d; }

#top {
  position:fixed; top:clamp(.6rem,1.5vh,1.1rem); left:clamp(.6rem,1.5vw,1.1rem); right:clamp(.6rem,1.5vw,1.1rem);
  z-index:10;
  display:flex; align-items:center; justify-content:space-between; gap:clamp(.5rem,1.2vw,1rem);
  flex-wrap:wrap;
  padding:clamp(.5rem,1.2vh,.9rem) clamp(.7rem,1.5vw,1.2rem);
  border-radius:10px;
  background:rgba(3,6,13,.92);
  border:1px solid rgba(0,255,255,.18);
  box-shadow:0 0 30px rgba(0,255,255,.06), 0 8px 32px rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
}
#title {
  font-size:clamp(.9rem,2vw,1.3rem); font-weight:900; letter-spacing:clamp(2px,1vw,6px);
  color:#00ffff; text-shadow:0 0 16px #00ffff66;
}
#subtitle {
  margin-top:clamp(.15rem,.4vh,.3rem);
  font-size:clamp(.5rem,.9vw,.7rem); letter-spacing:2px; color:#7abcd0;
}
#actions { display:flex; gap:clamp(.3rem,.8vw,.6rem); flex-wrap:wrap; justify-content:flex-end; }

.btn {
  border:1px solid rgba(0,255,255,.25);
  background:rgba(3,6,13,.7);
  color:rgba(0,255,255,.7);
  border-radius:6px;
  padding:clamp(5px,.8vh,9px) clamp(8px,1.2vw,14px);
  font-size:clamp(.6rem,1vw,.75rem); font-weight:900; letter-spacing:1px;
  cursor:pointer; text-decoration:none; font-family:'Courier New', monospace;
  transition:background .2s, color .2s, border-color .2s;
  white-space:nowrap; line-height:1.2;
}
.btn:hover { background:rgba(0,255,255,.12); color:#00ffff; border-color:rgba(0,255,255,.5); }
.btn.active { background:rgba(0,255,255,.15); color:#00ffff; border-color:rgba(0,255,255,.5); }
.btn.subtle { border-color:rgba(255,255,255,.1); color:rgba(255,255,255,.3); }
.btn.subtle:hover { background:rgba(255,255,255,.06); color:rgba(255,255,255,.6); border-color:rgba(255,255,255,.25); }
.btn:focus { outline:none; }

#legend {
  position:fixed; left:clamp(.6rem,1.5vw,1.1rem); bottom:clamp(.6rem,1.5vh,1.1rem);
  z-index:10; width:clamp(200px,28vw,320px);
  background:rgba(3,6,13,.92);
  border:1px solid rgba(0,255,255,.18);
  border-radius:10px;
  box-shadow:0 0 30px rgba(0,255,255,.06), 0 8px 32px rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
  padding:clamp(.7rem,1.5vh,1.1rem) clamp(.8rem,1.5vw,1.2rem);
}
#legend h2 {
  font-size:clamp(.65rem,1.2vw,.9rem); letter-spacing:4px; color:#00ffff;
  text-shadow:0 0 12px #00ffff55; margin-bottom:clamp(.5rem,1vh,.8rem);
}
.row {
  display:flex; align-items:center; gap:clamp(.4rem,.8vw,.7rem);
  margin:clamp(.3rem,.6vh,.5rem) 0;
  font-size:clamp(.55rem,1vw,.78rem); font-weight:900; letter-spacing:1px;
  cursor:pointer; user-select:none; transition:opacity .15s, filter .15s;
  color:#cce;
}
.row.off { opacity:.3; filter:grayscale(1); text-decoration:line-through; }
.sw {
  width:clamp(16px,2vw,24px); height:clamp(11px,1.3vh,16px);
  border-radius:3px; flex-shrink:0;
  border:2px solid rgba(255,255,255,.2);
  box-shadow:0 0 6px currentColor;
}
#stats {
  margin-top:clamp(.5rem,1vh,.8rem);
  padding-top:clamp(.4rem,.8vh,.7rem);
  border-top:1px solid rgba(0,255,255,.12);
  display:grid; grid-template-columns:1fr 1fr; gap:clamp(.25rem,.5vh,.4rem);
  font-size:clamp(.5rem,.85vw,.65rem); font-weight:900; color:#7abcd0; letter-spacing:1px;
}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div>
    <div id="title">⬡ DAM 2050 · ÉPÜLETKATEGÓRIÁK</div>
    <div id="subtitle">GOOGLE MŰHOLDKÉP · 453 DAM ELEM · 130 HA</div>
  </div>
  <div id="actions">
    <a class="btn" href="index.html">⬡ FŐOLDAL</a>
    <button class="btn active" id="satBtn" type="button">🛰 MŰHOLD</button>
    <button class="btn" id="mapBtn" type="button">🗺 TÉRKÉP</button>
    <button class="btn active" id="pdfBtn" type="button">🏭 DAM RÉTEG</button>
    <a class="btn subtle" href="dam_pdf_kalibracio.html">✏ SZERKESZTÉS</a>
    <button class="btn subtle" id="hideBtn" type="button">✕ UI KI</button>
  </div>
</div>

<div id="legend">
  <h2>JELMAGYARÁZAT</h2>

  <div class="row" data-layer="bontando"><span class="sw" style="background:#dc2626"></span>Bontandó</div>
  <div class="row" data-layer="bontasra_javasolt"><span class="sw" style="background:#f97316"></span>Bontásra javasolt</div>
  <div class="row" data-layer="hasznosításra_javasolt"><span class="sw" style="background:#84cc16"></span>Hasznosításra javasolt</div>
  <div class="row" data-layer="hasznosítandó"><span class="sw" style="background:#16a34a"></span>Hasznosítandó</div>
  <div class="row" data-layer="védett"><span class="sw" style="background:#2563eb"></span>Védett örökség</div>
  <div class="row" data-layer="roads"><span class="sw" style="background:#e5e7eb"></span>Betonozott út</div>
  <div class="row" data-layer="railways"><span class="sw" style="background:#111827; border-color:#ef4444"></span>Vasút</div>
  <div id="stats">
    <div id="totalStat">453 DAM elem</div>
    <div id="nameStat">nevek betöltése...</div>
    <div id="labelStat">DAM feliratok...</div>
    <div>130 ha terület</div>
  </div>
</div>

<script src="google_maps_key_public.js"></script>
<script>
window.gm_authFailure = function() {
  document.getElementById('subtitle').textContent = 'Google API hiba: kulcs vagy referrer tiltás.';
};

const CAT = {
  bontando:                 { label:'Bontandó', fill:'#dc2626' },
  bontasra_javasolt:        { label:'Bontásra javasolt', fill:'#f97316' },
  'hasznosításra_javasolt': { label:'Hasznosításra javasolt', fill:'#84cc16' },
  'hasznosítandó':          { label:'Hasznosítandó', fill:'#16a34a' },
  'védett':                 { label:'Védett örökség', fill:'#2563eb' }
};
let map;
let bounds;
let pdfPolygons = [];
let infrastructureOverlays = [];
let pdfVisible = true;
let layerVisibility = {
  bontando:true,
  bontasra_javasolt:true,
  'hasznosításra_javasolt':true,
  'hasznosítandó':true,
  'védett':true,
  roads:true,
  railways:true
};
let currentInfoWindow = null;
const MAPS_3D_OFFSET_METERS = { north: -250, east: 0 };

function loadGoogle() {
  if (!window.GOOGLE_MAPS_API_KEY || window.GOOGLE_MAPS_API_KEY.includes('PASTE_')) {
    document.getElementById('subtitle').textContent = 'Hiányzó Google API kulcs: google_maps_key.js';
    return;
  }
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(window.GOOGLE_MAPS_API_KEY)}&callback=initMap&v=weekly&loading=async`;
  s.async = true;
  s.defer = true;
  document.head.appendChild(s);
}

window.initMap = function() {
  map = new google.maps.Map(document.getElementById('map'), {
    center:{ lat:48.0963, lng:20.7398 },
    zoom:16,
    mapTypeId:'satellite',
    renderingType:'RASTER',
    backgroundColor:'#e5e7eb',
    tilt:0,
    fullscreenControl:false,
    streetViewControl:false,
    mapTypeControl:false,
    gestureHandling:'greedy'
  });
  bounds = new google.maps.LatLngBounds();
  if(!IS_EMBED) wireUi();
  loadLayers();
  if(IS_EMBED){
    google.maps.event.addListenerOnce(map,'idle',()=>{
      mapReady = true;
      msgQueue.forEach(handleCmd);
      msgQueue.length = 0;
      window.parent.postMessage({damReady:true},'*');
    });
  }
};

function wireUi() {
  document.getElementById('satBtn').addEventListener('click', () => setBase('satellite'));
  document.getElementById('mapBtn').addEventListener('click', () => setBase('roadmap'));
  document.getElementById('pdfBtn').addEventListener('click', () => {
    pdfVisible = !pdfVisible;
    document.getElementById('pdfBtn').classList.toggle('active', pdfVisible);
    applyLayerVisibility();
    if (!pdfVisible && currentInfoWindow) currentInfoWindow.close();
  });
  document.querySelectorAll('#legend .row[data-layer]').forEach(row => {
    row.addEventListener('click', () => {
      const layer = row.dataset.layer;
      layerVisibility[layer] = !layerVisibility[layer];
      row.classList.toggle('off', !layerVisibility[layer]);
      applyLayerVisibility();
    });
  });
  document.getElementById('hideBtn').addEventListener('click', () => {
    document.getElementById('top').style.display = 'none';
    document.getElementById('legend').style.display = 'none';
  });
}

function setBase(type) {
  map.setMapTypeId(type);
  const sb = document.getElementById('satBtn');
  const mb = document.getElementById('mapBtn');
  if(sb) sb.classList.toggle('active', type === 'satellite');
  if(mb) mb.classList.toggle('active', type === 'roadmap');
}

function loadLayers() {
  Promise.all([
    fetch('dam_buildings2.json?cb=' + Date.now()).then(r => r.json()),
    fetch('dam_pdf_corner_calibration.json?cb=' + Date.now()).then(r => r.json()),
    fetch('dam_prez_infrastructure.json?cb=' + Date.now()).then(r => r.json())
  ]).then(([pdfSource, calibrationData, infrastructureData]) => {
    const pdfFeatures = buildPdfFeatures(pdfSource.buildings, pdfSource.labels || [], calibrationData.calibration);
    renderInfrastructure(infrastructureData);
    renderPdf(pdfFeatures);
    const named = pdfFeatures.filter(f => f.name).length;
    document.getElementById('totalStat').textContent = `${pdfFeatures.length} DAM elem`;
    document.getElementById('nameStat').textContent = `${named} név`;
    document.getElementById('labelStat').textContent = `${(pdfSource.labels || []).length} DAM felirat`;
    map.fitBounds(bounds, 90);
  }).catch(err => {
    document.getElementById('subtitle').textContent = 'Réteg betöltési hiba: ' + err.message;
  });
}

function renderInfrastructure(data) {
  renderPathLines(data.roads || [], {
    layer:'roads',
    strokeColor:'#1f2937',
    strokeOpacity:.36,
    strokeWeight:5,
    zIndex:0
  });
  renderPathLines(data.roads || [], {
    layer:'roads',
    strokeColor:'#f4efe1',
    strokeOpacity:.78,
    strokeWeight:2,
    zIndex:1
  });
  renderPathLines(data.railways || [], {
    layer:'railways',
    strokeColor:'#111827',
    strokeOpacity:.82,
    strokeWeight:3,
    zIndex:1
  });
  renderPathLines(data.railways || [], {
    layer:'railways',
    strokeColor:'#ef4444',
    strokeOpacity:.78,
    strokeWeight:1,
    zIndex:1
  });
}

function renderPathLines(items, style) {
  items.forEach(item => {
    if (!Array.isArray(item.path) || item.path.length < 2) return;
    const line = new google.maps.Polyline({
      path:item.path,
      strokeColor:style.strokeColor,
      strokeOpacity:style.strokeOpacity,
      strokeWeight:style.strokeWeight,
      clickable:false,
      map:pdfVisible && layerVisibility[style.layer] ? map : null,
      zIndex:style.zIndex
    });
    infrastructureOverlays.push({ overlay:line, layer:style.layer });
  });
}

function applyLayerVisibility() {
  pdfPolygons.forEach(item => {
    item.halo.setMap(pdfVisible && layerVisibility[item.cat] ? map : null);
    item.poly.setMap(pdfVisible && layerVisibility[item.cat] ? map : null);
  });
  infrastructureOverlays.forEach(item => {
    item.overlay.setMap(pdfVisible && layerVisibility[item.layer] ? map : null);
  });
}

function buildPdfFeatures(buildings, pdfLabels, calibration) {
  return buildings
    .filter(b => Array.isArray(b.pts) && b.pts.length >= 3 && Array.isArray(b.bbox))
    .map((b, i) => {
      const coords = b.pts.map(p => warpPoint(p[0], p[1], calibration));
      return {
        id:`pdf_${i}`,
        pdf_idx:i,
        cat:b.cat,
        name:b.name || '',
        bbox:b.bbox,
        cx:b.cx,
        cy:b.cy,
        pointCount:b.pts.length,
        pdfLabels:nearbyPdfLabels(b, pdfLabels),
        coords,
        center:center(coords),
        area:polygonAreaMeters(coords),
        size:boundsMeters(coords)
      };
    });
}

function nearbyPdfLabels(building, pdfLabels) {
  const bbox = building.bbox;
  const width = bbox[2] - bbox[0];
  const height = bbox[3] - bbox[1];
  const padX = Math.max(0.012, width * 0.8);
  const padY = Math.max(0.012, height * 0.8);
  const minX = bbox[0] - padX;
  const maxX = bbox[2] + padX;
  const minY = bbox[1] - padY;
  const maxY = bbox[3] + padY;
  const skip = new Set(['V', 'a', 's', 'g', 'y', 'á', 'r', 'i', 'u', 't', 'c', 'n', 'o', 'm', 'z', 'f', 'd', 'ő', 'ü', 'l', 'e', 'p', '-', '.', '(', ')']);
  const labels = pdfLabels
    .filter(l => l.x >= minX && l.x <= maxX && l.y >= minY && l.y <= maxY)
    .map(l => String(l.text || '').trim())
    .filter(t => t && (!skip.has(t) || /\d/.test(t)))
    .filter(isUsefulDamLabel)
    .filter((t, i, arr) => arr.indexOf(t) === i);
  const ordered = [];
  if (building.name) ordered.push(building.name);
  labels.forEach(t => {
    if (!ordered.includes(t)) ordered.push(t);
  });
  return ordered.slice(0, 24);
}

function isUsefulDamLabel(text) {
  const t = String(text || '').trim();
  if (!t) return false;
  if (t.length === 1) return false;
  if (/^\d{1,5}([-/]\d{1,3})?\.?$/.test(t)) return false;
  if (/^\d+([-.]\d+)+$/.test(t)) return false;
  if (!/[A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű]/.test(t)) return false;
  return true;
}

function warpPoint(x, y, calibration) {
  const topLat = lerp(calibration.tl.lat, calibration.tr.lat, x);
  const topLng = lerp(calibration.tl.lng, calibration.tr.lng, x);
  const bottomLat = lerp(calibration.bl.lat, calibration.br.lat, x);
  const bottomLng = lerp(calibration.bl.lng, calibration.br.lng, x);
  return [lerp(topLat, bottomLat, y), lerp(topLng, bottomLng, y)];
}

function center(coords) {
  const sum = coords.reduce((acc, p) => [acc[0] + p[0], acc[1] + p[1]], [0, 0]);
  return [sum[0] / coords.length, sum[1] / coords.length];
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function renderPdf(features) {
  features.forEach(f => {
    const cfg = CAT[f.cat] || { fill:'#64748b', label:'Egyéb' };
    const path = f.coords.map(c => ({ lat:c[0], lng:c[1] }));
    path.forEach(p => bounds.extend(p));
    const halo = new google.maps.Polygon({
      paths:path, strokeColor:'#fff', strokeOpacity:.96, strokeWeight:9, fillOpacity:0, map:pdfVisible ? map : null, zIndex:2
    });
    const poly = new google.maps.Polygon({
      paths:path, strokeColor:cfg.fill, strokeOpacity:1, strokeWeight:4,
      fillColor:cfg.fill, fillOpacity:.42, map:pdfVisible ? map : null, zIndex:3
    });
    const info = new google.maps.InfoWindow();
    const openInfo = e => {
      if (!pdfVisible) return;
      if (currentInfoWindow) currentInfoWindow.close();
      currentInfoWindow = info;
      info.setContent(infoHtml(f, cfg, [e.latLng.lat(), e.latLng.lng()]));
      info.setPosition(e.latLng);
      info.open({ map });
    };
    halo.addListener('click', openInfo);
    poly.addListener('click', openInfo);
    pdfPolygons.push({ halo, poly, cat:f.cat });
  });
}

function infoHtml(f, cfg, target) {
  const displayLabels = f.pdfLabels;
  const title = f.name || displayLabels[0] || 'DAM épület';
  const labels = displayLabels.length
    ? displayLabels.map(t => `<div style="margin-top:4px; padding:6px 8px; border-radius:6px; background:#eef2ff; color:#1e293b; font-weight:850; line-height:1.35">${escapeHtml(t)}</div>`).join('')
    : '<span style="color:#64748b">nincs közeli felirat</span>';
  const linkPoint = target || f.center;
  const maps3dPoint = offsetLatLng(linkPoint[0], linkPoint[1], MAPS_3D_OFFSET_METERS.north, MAPS_3D_OFFSET_METERS.east);
  const lat = maps3dPoint[0].toFixed(7);
  const lng = maps3dPoint[1].toFixed(7);
  const pinLat = linkPoint[0].toFixed(7);
  const pinLng = linkPoint[1].toFixed(7);
  const centerLat = f.center[0].toFixed(6);
  const centerLng = f.center[1].toFixed(6);
  const maps3dUrl = `https://www.google.com/maps/@${lat},${lng},180a,35y,0h,60t/data=!3m1!1e3?entry=ttu`;
  const mapsPinUrl = `https://www.google.com/maps/search/?api=1&query=${pinLat},${pinLng}`;
  const area = Math.round(f.area).toLocaleString('hu-HU');
  const width = Math.round(f.size.width).toLocaleString('hu-HU');
  const height = Math.round(f.size.height).toLocaleString('hu-HU');
  return `
    <div style="min-width:300px; max-width:390px; font:13px Arial, sans-serif; color:#111827">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px">
        <div>
          <div style="font-size:18px; font-weight:950; line-height:1.2">${escapeHtml(title)}</div>
          <div style="margin-top:3px; color:#64748b; font-weight:800">DAM elem #${f.pdf_idx}</div>
        </div>
        <div style="white-space:nowrap; padding:5px 8px; border-radius:999px; background:${cfg.fill}; color:#fff; font-size:11px; font-weight:950">
          ${escapeHtml(cfg.label)}
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0">
        <div style="padding:8px; border:1px solid #e2e8f0; border-radius:6px"><strong>Alapterület</strong><br>${area} m2</div>
        <div style="padding:8px; border:1px solid #e2e8f0; border-radius:6px"><strong>Méret</strong><br>${width} x ${height} m</div>
        <div style="padding:8px; border:1px solid #e2e8f0; border-radius:6px"><strong>Poligonpont</strong><br>${f.pointCount}</div>
        <div style="padding:8px; border:1px solid #e2e8f0; border-radius:6px"><strong>Épület közepe</strong><br>${centerLat}, ${centerLng}</div>
      </div>
      <div style="margin-top:10px">
        <div style="font-weight:950; margin-bottom:3px">DAM feliratok</div>
        <div>${labels}</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px">
        <a href="${maps3dUrl}" target="_blank" rel="noopener" style="display:inline-block; padding:9px 11px; background:#111827; color:#fff; border-radius:6px; text-decoration:none; font-weight:950">
          Google Maps 3D
        </a>
        <a href="${mapsPinUrl}" target="_blank" rel="noopener" style="display:inline-block; padding:9px 11px; background:#eef2ff; color:#1e293b; border-radius:6px; text-decoration:none; font-weight:950">
          Koordináta megnyitása
        </a>
      </div>
      <div style="margin-top:8px; color:#64748b; font-size:12px; font-weight:700">
        A 3D gomb csak a Google Maps 3D nézetéhez kompenzált célpontot használ; az adatok és a koordináta gomb az eredeti kattintott ponton maradnak.
      </div>
    </div>
  `;
}

function polygonAreaMeters(coords) {
  if (coords.length < 3) return 0;
  const lat0 = coords.reduce((sum, p) => sum + p[0], 0) / coords.length;
  const metersPerLat = 111320;
  const metersPerLng = 111320 * Math.cos(lat0 * Math.PI / 180);
  const pts = coords.map(p => [p[1] * metersPerLng, p[0] * metersPerLat]);
  let area = 0;
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    area += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
  }
  return Math.abs(area) / 2;
}

function boundsMeters(coords) {
  const lats = coords.map(p => p[0]);
  const lngs = coords.map(p => p[1]);
  const south = Math.min(...lats);
  const north = Math.max(...lats);
  const west = Math.min(...lngs);
  const east = Math.max(...lngs);
  const midLat = (south + north) / 2;
  return {
    width:distanceMeters(midLat, west, midLat, east),
    height:distanceMeters(south, west, north, west)
  };
}

function distanceMeters(lat1, lng1, lat2, lng2) {
  const r = 6371000;
  const toRad = v => v * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * r * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function offsetLatLng(lat, lng, northMeters, eastMeters) {
  const metersPerLat = 111320;
  const metersPerLng = 111320 * Math.cos(lat * Math.PI / 180);
  return [
    lat + northMeters / metersPerLat,
    lng + eastMeters / metersPerLng
  ];
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

loadGoogle();

// Embed mód: ?embed=1 paraméter esetén saját UI eltávolítva, postMessage vezérlés
const IS_EMBED = new URLSearchParams(location.search).get('embed') === '1';
const msgQueue = [];
let mapReady = false;

function handleCmd(cmd){
  if(cmd==='sat') setBase('satellite');
  else if(cmd==='map') setBase('roadmap');
  else if(cmd==='pdf'){ pdfVisible=!pdfVisible; applyLayerVisibility(); }
}

if(IS_EMBED){
  document.addEventListener('DOMContentLoaded', ()=>{
    const top = document.getElementById('top');
    const leg = document.getElementById('legend');
    if(top) top.remove();
    if(leg) leg.remove();
  });
  window.addEventListener('message', e=>{
    if(!e.data || !e.data.dam) return;
    if(mapReady) handleCmd(e.data.dam);
    else msgQueue.push(e.data.dam);
  });
}
</script>
</body>
</html>
